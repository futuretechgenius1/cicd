name: AI Test Generation Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  ai-test-gen:
    name: Generate & Verify AI JUnit Tests
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore(ai): add generated junit tests')"
    timeout-minutes: 20

    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch Target Base Branch (origin/main)
        run: |
          git fetch origin main:origin/main || true

      - name: Run AI JUnit Test Generator
        env:
          AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'openrouter' }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL || 'google/gemma-4-31b-it:free' }}
          BASE_BRANCH: origin/main
          MIN_COVERAGE_RATIO: '0.80'
          MAX_REGEN_ATTEMPTS: '3'
        run: |
          echo "AI_PROVIDER: $AI_PROVIDER"
          echo "AI_MODEL: $AI_MODEL"
          echo "AI_API_KEY configured: $(if [ -n "$AI_API_KEY" ]; then echo 'YES'; else echo 'NO'; fi)"
          python .ai/scripts/generate_tests.py

      - name: Execute Tests & Verify Compilation
        run: mvn test -B

      - name: Verify JaCoCo Coverage Threshold (Min 80%)
        run: mvn jacoco:report jacoco:check -B

      - name: Commit AI Generated Tests (Prevent Infinite Loop)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain src/test/java)" ]; then
            git add src/test/java
            git commit -m "chore(ai): add generated junit tests for PR #${{ github.event.pull_request.number }}"
            git push origin HEAD:${{ github.head_ref }}
            echo "AI-generated tests committed and pushed successfully."
          else
            echo "No test file changes to commit."
          fi

      - name: Publish AI Test Generation Report to PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const outcome = '${{ job.status }}';
            const body = `### 🤖 AI Test Generation Report

            **Status:** ${outcome === 'success' ? '✅ PASS' : '❌ FAILED'}
            **Trigger Event:** PR #${context.issue.number}

            - **Changed Production Code Analysis:** Completed
            - **JUnit 5 Test Generation:** Executed
            - **JaCoCo Quality Gate (80% Minimum):** Verified

            > *AI-generated tests are scoped exclusively to \`src/test/java/\` to preserve application logic integrity.*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
